<text x="1300" y="627" text-anchor="middle" class="sub">ボタンを押してモールスで文を打つ</text>

<!-- ===== 矢印 ===== -->
<!-- ② ③ ポケベル ⇄ サーバー -->
<line x1="332" y1="345" x2="586" y2="345" stroke="#1f6fd1" stroke-width="3" marker-end="url(#a2)"/>
<line x1="588" y1="385" x2="334" y2="385" stroke="#d9730d" stroke-width="3" marker-end="url(#a3)"/>
