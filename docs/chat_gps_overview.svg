<circle cx="392" cy="402" r="13" fill="#d9730d" stroke="#fff" stroke-width="2"/><text x="392" y="407" text-anchor="middle" class="badge">3</text>
<text x="412" y="407" class="lbl" fill="#d9730d">新しいチャット</text>
