<circle cx="995" cy="490" r="13" fill="#a0522d" stroke="#fff" stroke-width="2"/><text x="995" y="495" text-anchor="middle" class="badge">5</text>
<text x="1015" y="495" class="lbl" fill="#a0522d">トン・ツー</text>

<!-- ===== やりとりするデータ ===== -->
<text x="30" y="716" font-size="21" class="b">やりとりするデータ</text>

<!-- 1 -->
<rect x="30" y="732" width="345" height="172" rx="10" class="card"/>
<circle cx="54" cy="758" r="13" fill="#6b7fa3"/><text x="54" y="763" text-anchor="middle" class="badge">1</text>
<text x="76" y="764" font-size="15" class="b">GPS の衛星 → ポケベル</text>
<rect x="44" y="776" width="317" height="54" rx="6" class="exbox"/>
<text x="54" y="798" class="ex">時刻: 17:26:03.1204…</text>
<text x="54" y="819" class="ex">衛星の位置（軌道の情報）</text>
<text x="44" y="852" class="tx">衛星は、時刻と自分の位置を電波で流し続ける。</text>
<text x="44" y="871" class="tx">4 つ以上の電波が届くまでの時間の差から、</text>
<text x="44" y="890" class="tx">ポケベルが自分のいる場所を計算する。</text>

<!-- 2 -->
<rect x="395" y="732" width="345" height="172" rx="10" class="card"/>
<circle cx="419" cy="758" r="13" fill="#1f6fd1"/><text x="419" y="763" text-anchor="middle" class="badge">2</text>
<text x="441" y="764" font-size="15" class="b">ポケベル → サーバー</text>
<rect x="409" y="776" width="317" height="54" rx="6" class="exbox"/>
<text x="419" y="798" class="ex">場所: 17:26 北緯 35.68 東経 139.76 時速 4km</text>
<text x="419" y="819" class="ex">チャット: HELLO（ボタンで打った文）</text>
<text x="409" y="852" class="tx">場所は 1 分ごとに自動で送る。チャットは、</text>
<text x="409" y="871" class="tx">ボタンでモールスを打って送ったとき。</text>
<text x="409" y="890" class="tx">Wi-Fi かスマホのテザリングでつなぐ。</text>

<!-- 3 -->
<rect x="760" y="732" width="345" height="172" rx="10" class="card"/>
<circle cx="784" cy="758" r="13" fill="#d9730d"/><text x="784" y="763" text-anchor="middle" class="badge">3</text>
<text x="806" y="764" font-size="15" class="b">サーバー → ポケベル</text>
<rect x="774" y="776" width="317" height="54" rx="6" class="exbox"/>
<text x="784" y="798" class="ex">チャット: raspi 17:25 <tspan class="mono">ｵｶｴﾘ</tspan></text>
<text x="784" y="819" class="ex">30 秒ごとに「つながってるよ」の合図</text>
<text x="774" y="852" class="tx">新しいチャットが来たら、すぐ届ける。</text>
<text x="774" y="871" class="tx">ポケベルはサーバーと電話をつなぎっぱなし</text>
<text x="774" y="890" class="tx">にしているので、待たずに受け取れる。</text>

<!-- 4 -->
<rect x="1125" y="732" width="345" height="172" rx="10" class="card"/>
<circle cx="1149" cy="758" r="13" fill="#2e8b57"/><text x="1149" y="763" text-anchor="middle" class="badge">4</text>
<text x="1171" y="764" font-size="15" class="b">サーバー → ラズパイ 5</text>
<rect x="1139" y="776" width="317" height="54" rx="6" class="exbox"/>
<text x="1149" y="798" class="ex">場所が 1 つ増えた: 17:26 北緯… 東経…</text>
<text x="1149" y="819" class="ex">チャットが 1 件増えた: ポケベル「HELLO」</text>
<text x="1139" y="852" class="tx">ラズパイ 5 が 5 秒ごとに「新しいのある？」と</text>
<text x="1139" y="871" class="tx">聞きに行き、前の回から増えた分だけもらう。</text>
<text x="1139" y="890" class="tx">地図に道を描き足し、チャットを並べる。</text>

<!-- 5 -->
<rect x="30" y="920" width="345" height="172" rx="10" class="card"/>
<circle cx="54" cy="946" r="13" fill="#a0522d"/><text x="54" y="951" text-anchor="middle" class="badge">5</text>
<text x="76" y="952" font-size="15" class="b">モールス伝信機 → ラズパイ 5</text>
<rect x="44" y="964" width="317" height="54" rx="6" class="exbox"/>
<text x="54" y="986" class="ex">・ー（短く押す・長く押す）→ A</text>
<text x="54" y="1007" class="ex">和文のとき: ・ー → イ</text>
<text x="44" y="1040" class="tx">短く押すとトン（・）、長く押すとツー（ー）。</text>
<text x="44" y="1059" class="tx">ラズパイ 5 がその並びを文字にする。</text>
<text x="44" y="1078" class="tx">ボタンはほかに「1 字消す」「送る」「和文」。</text>

<!-- 6 -->
<rect x="395" y="920" width="345" height="172" rx="10" class="card"/>
<circle cx="419" cy="946" r="13" fill="#7b4fc4"/><text x="419" y="951" text-anchor="middle" class="badge">6</text>
<text x="441" y="952" font-size="15" class="b">ラズパイ 5 → サーバー</text>
<rect x="409" y="964" width="317" height="54" rx="6" class="exbox"/>
<text x="419" y="986" class="ex">チャット: オカエリ</text>
<text x="419" y="1007" class="ex">名前: raspi（家のラズパイ 5 のこと）</text>
<text x="409" y="1040" class="tx">「送る」を押すと、打った文をサーバーへ。</text>
<text x="409" y="1059" class="tx">サーバーはこれもポケベルに配るので（③）、</text>
<text x="409" y="1078" class="tx">ポケベルの画面に「<tspan class="mono">ｵｶｴﾘ</tspan>」と出る。</text>

<!-- 7 -->
<rect x="760" y="920" width="345" height="172" rx="10" class="card"/>
<circle cx="784" cy="946" r="13" fill="#0f8b8d"/><text x="784" y="951" text-anchor="middle" class="badge">7</text>
<text x="806" y="952" font-size="15" class="b">ラズパイ 5 → ディスプレイ</text>
<rect x="774" y="964" width="317" height="54" rx="6" class="exbox"/>
<text x="784" y="986" class="ex">左: 地図と通った道　右: チャット</text>
<text x="784" y="1007" class="ex">下: いま打っている文字</text>
<text x="774" y="1040" class="tx">ラズパイ 5 が地図とチャットのページを絵に</text>
<text x="774" y="1059" class="tx">して、ケーブル（HDMI）でディスプレイに映す。</text>
<text x="774" y="1078" class="tx">地図の絵はネットの OpenStreetMap から。</text>

<!-- 安全のくふう -->
<rect x="1125" y="920" width="345" height="172" rx="10" fill="#fffaf0" stroke="#e0c48a" stroke-width="1.2"/>
<g transform="translate(1149,946)">
  <rect x="-8" y="-3" width="16" height="13" rx="2" fill="#c08a1e"/>
  <path d="M-5,-3 V-7 A5,5 0 0 1 5,-7 V-3" fill="none" stroke="#c08a1e" stroke-width="2.4"/>
</g>
<text x="1171" y="952" font-size="15" class="b">安全のくふう</text>
<text x="1139" y="984" class="tx">・インターネットを通る ②③ は暗号をかける。</text>
<text x="1139" y="1003" class="tx">　合言葉を知らないとサーバーに入れない</text>
<text x="1139" y="1028" class="tx">・場所は個人情報なので、④⑥ は自分の</text>
<text x="1139" y="1047" class="tx">　機械どうしの専用の道だけで通す</text>
<text x="1139" y="1072" class="tx">・サーバーは届いたものを全部書き残す</text>
</svg>
