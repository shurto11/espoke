<rect width="1500" height="1110" fill="#ffffff"/>

<!-- ===== 題 ===== -->
<text x="30" y="50" font-size="28" class="b">ポケベルのチャットと GPS — 何がどこへ届くのか</text>
<text x="30" y="82" font-size="15" class="m">ポケベルの場所とチャットは、学校のサーバーを通って家のディスプレイへ。家のモールス伝信機で打った文は、ポケベルへ届く。</text>

<!-- ===== 場所の区切り ===== -->
<rect x="30" y="110" width="410" height="560" rx="14" fill="#eef4fb"/>
<text x="48" y="138" class="zone" fill="#3b5f8a">そと（持ち歩く）</text>
<rect x="460" y="110" width="420" height="560" rx="14" fill="#f7f3ea"/>
<text x="478" y="138" class="zone" fill="#8a7445">学校</text>
<rect x="900" y="110" width="570" height="560" rx="14" fill="#edf6ed"/>
<text x="918" y="138" class="zone" fill="#3f7a3f">家</text>

<!-- ===== GPS の衛星 ===== -->
<text x="235" y="164" text-anchor="middle" class="sub">宇宙: GPS の衛星（約 2 万 km 上空を回っている）</text>
<use href="#sat" x="95" y="196"/>
<use href="#sat" x="235" y="184"/>
<use href="#sat" x="375" y="200"/>
