  <g stroke="#ccc"><line x1="708" y1="542" x2="748" y2="542"/><line x1="708" y1="554" x2="748" y2="554"/><line x1="708" y1="566" x2="743" y2="566"/><line x1="708" y1="578" x2="748" y2="578"/></g>
  <text x="626" y="617" text-anchor="middle" class="tx">チャットの記録</text>
