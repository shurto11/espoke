<text x="230" y="508" text-anchor="middle" font-size="9" fill="#ddd">頭脳</text>
<text x="230" y="598" text-anchor="middle" class="name">ポケベル</text>
<text x="230" y="620" text-anchor="middle" class="sub">画面とボタン 4 つ、GPS の受信機。</text>
<text x="230" y="639" text-anchor="middle" class="sub">頭脳は小さなコンピューター「ラズパイ Pico」</text>

<!-- ===== サーバー ===== -->
